[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "promptbench-toolkit"
version = "0.1.0"
description = "A lightweight, provider-neutral toolkit for deterministic prompt and model-output evaluations."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["llm", "prompts", "evaluation", "testing", "ai", "prompt-engineering"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Testing",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
promptbench = "promptbench.cli:main"

[tool.setuptools.packages.find]
include = ["promptbench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
